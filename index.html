<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tải Ngọc Rồng Online</title><style>body{font:18px system-ui;max-width:620px;margin:70px auto;padding:24px;background:#f7f8fc;color:#203047}a{display:block;padding:18px;margin:16px 0;background:#176bce;color:white;text-decoration:none;border-radius:10px}small{color:#526275}</style><h1>Ngọc Rồng Online</h1><p>Cài bản mới này một lần. Game tự cập nhật địa chỉ kết nối khi máy chủ mở.</p><p id="status">Đang kiểm tra máy chủ…</p><div id="downloads"></div><small>Cần máy chủ đang mở để tải và chơi. Thay đổi giao diện hoặc mã game vẫn có thể cần bản cập nhật.</small><script>async function check(){try{const r=await fetch("https://raw.githubusercontent.com/datcong05102004/GameNro-server-config/main/server.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error();const s=await r.json();if(!s.downloadBase||s.expiresMs<=Date.now())throw Error();const b=new URL(s.downloadBase);if(b.protocol!=="https:"||!b.hostname.endsWith(".trycloudflare.com"))throw Error();document.getElementById("status").textContent="Bản tải hiện tại:";const d=document.getElementById("downloads");d.replaceChildren();for(const [name,file] of [["Tải bản PC (Windows)","GameNro-PC-Online.zip"],["Tải bản Android (APK)","GameNro.apk"],["Bản vá nhỏ cho PC đã cài","GameNro-PC-Online-patch.zip"]]){const a=document.createElement("a");a.textContent=name;a.href=b.origin+"/"+file;d.append(a)}}catch(e){document.getElementById("status").textContent="Máy chủ chưa sẵn sàng. Trang sẽ tự kiểm tra lại.";document.getElementById("downloads").replaceChildren()}}check();setInterval(check,15000)</script></html>
